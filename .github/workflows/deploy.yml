name: Deploy to Cloudflare Workers

# The OpenNext build must run on Linux. Building on Windows corrupts the
# generated chunk-loading paths (backslashes are consumed as escapes), which
# produces a worker that 500s on every SSR route.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the same Worker.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from the packageManager field in package.json
        uses: pnpm/action-setup@v6

      - name: Set up Node
        # @opennextjs/cloudflare requires Node >=22.
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Baked into the bundle at build time: canonical URLs, sitemap.xml,
          # robots.txt and JSON-LD all read this via lib/config.ts.
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: Smoke test live API
        # `next build` passes even when a route only breaks inside workerd, so check
        # the deployed Worker itself. The _smoke param makes each run a cache miss,
        # forcing the full handler path rather than a cached edge response.
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://zento.haikalakif.com' }}
        run: |
          check() {
            for attempt in 1 2 3 4 5; do
              status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$APP_URL$1")
              [ "$status" = "200" ] && { echo "OK   $1"; return 0; }
              echo "Attempt $attempt: HTTP $status for $1"
              sleep 5
            done
            echo "::error::$1 returned HTTP $status after deploy"
            return 1
          }
          check "/"
          check "/usd-to-myr"
          check "/api/rates?base=USD&symbols=MYR&_smoke=${{ github.run_id }}"
          check "/api/historical?base=USD&target=EUR&days=7&_smoke=${{ github.run_id }}"
