name: Deploy to Cloudflare Workers

# The OpenNext build must run on Linux. Building on Windows corrupts the
# generated chunk-loading paths (backslashes are consumed as escapes), which
# produces a worker that 500s on every SSR route.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the same Worker.
concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        # @opennextjs/cloudflare requires Node >=22.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Build and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Baked into the bundle at build time: canonical URLs, sitemap.xml,
          # robots.txt and JSON-LD all read this via lib/config.ts.
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
